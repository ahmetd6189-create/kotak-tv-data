name: Mac defteri
# Her 3 saatte bir: ucretsiz yayin akislarindaki spor kanallarini okur, ledger.json'u gunceller.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ledger
  cancel-in-progress: false
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Defteri guncelle
        run: node build-ledger.cjs
      - name: Degistiyse kaydet
        run: |
          if git diff --quiet -- ledger.json; then echo "degisiklik yok"; exit 0; fi
          git config user.name "kotak-ledger"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger.json
          git commit -m "Mac defteri guncellendi"
          git push
